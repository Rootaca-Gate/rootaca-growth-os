services:
  postgres:
    image: postgres:16-alpine
    container_name: rootaca-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: rootaca
      POSTGRES_PASSWORD: rootaca
      POSTGRES_DB: rootaca
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rootaca -d rootaca']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
