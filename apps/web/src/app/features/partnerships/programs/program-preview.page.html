@if (loading()) {
  <app-loading-skeleton variant="table" [label]="'partnerships.programsLoading' | t" />
} @else if (error(); as message) {
  <app-error-state
    [title]="'partnerships.programsLoadError' | t"
    [message]="message"
    (retry)="reload()"
  />
} @else if (program(); as current) {
  <div class="preview-toolbar no-print">
    <div class="preview-toolbar-copy">
      <h1>{{ 'partnerships.previewProgram' | t }}</h1>
      <p>{{ current.name }}</p>
    </div>
    <div class="preview-toolbar-actions">
      <a mat-stroked-button [routerLink]="['/partnerships/programs', current.id]">{{
        'common.back' | t
      }}</a>
      <button mat-stroked-button type="button" (click)="openPrintPreview()">
        {{ 'partnerships.previewPdf' | t }}
      </button>
      <button
        mat-flat-button
        color="primary"
        type="button"
        [disabled]="downloading()"
        (click)="downloadPdf()"
      >
        {{ downloading() ? ('partnerships.pdfDownloading' | t) : ('partnerships.downloadPdf' | t) }}
      </button>
    </div>
  </div>

  @if (previewUrl(); as url) {
    <div class="preview-frame-wrap">
      <iframe class="preview-frame" [src]="url" title="ROOTACA Program PDF Preview"></iframe>
    </div>
  }
}
